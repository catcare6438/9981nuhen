<!DOCTYPE html>

<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>貓窩裏｜毛孩爸媽專區</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pk:#FF8FA3;--pk2:#FFB6C1;--pk3:#FFD6E0;--pk4:#FFF0F5;--pk5:#FFFAFB;
  --y:#FFE066;--y3:#FFB800;
  --g:#52C48A;--g2:#D4F5E4;
  --t:#3D2B35;--tl:#9B7A8A;
  --sh:0 4px 20px rgba(255,143,163,.18);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--pk5);color:var(--t);min-height:100vh;}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#FFD0DF 0%,#FFF5F8 55%,#FFE8EF 100%);}
.lbox{background:#fff;border:3px solid var(--pk3);border-radius:28px;
  padding:42px 34px;width:380px;max-width:95vw;text-align:center;
  box-shadow:var(--sh);position:relative;overflow:hidden;}
.lbox::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--pk),var(--pk2),var(--y),var(--pk2),var(--pk));
  background-size:200%;animation:sh 3s linear infinite;}
@keyframes sh{0%{background-position:0%;}100%{background-position:200%;}}
.l-ico{font-size:3.2rem;margin-bottom:10px;animation:bounce 2.5s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.l-title{font-family:'Nunito',sans-serif;font-size:1.5rem;font-weight:900;color:var(--pk);
  margin-bottom:4px;text-shadow:2px 2px 0 #fff;}
.l-sub{font-size:.82rem;color:var(--tl);margin-bottom:6px;}
.l-hint{background:var(--pk4);border:1.5px solid var(--pk3);border-radius:12px;
  padding:10px 14px;font-size:.8rem;color:var(--tl);margin-bottom:20px;line-height:1.6;}
.l-in{width:100%;padding:13px 18px;background:var(--pk5);border:2.5px solid var(--pk3);
  border-radius:12px;color:var(--t);font-size:1rem;font-family:inherit;outline:none;
  text-align:center;letter-spacing:4px;transition:border .2s;margin-bottom:12px;}
.l-in:focus{border-color:var(--pk);}
.l-btn{width:100%;padding:13px;background:linear-gradient(135deg,#FF5C7D,var(--pk));
  color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:900;
  font-family:'Nunito',sans-serif;cursor:pointer;transition:all .2s;
  box-shadow:0 6px 18px rgba(255,92,125,.28);}
.l-btn:hover{transform:translateY(-2px);}
.l-err{color:#F87171;font-size:.8rem;margin-top:8px;display:none;}

/* MAIN */
#mainScreen{display:none;}
.topbar{background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border-bottom:2.5px solid var(--pk3);padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(255,143,163,.12);}
.topbar-l{display:flex;align-items:center;gap:10px;}
.top-av{font-size:1.8rem;}
.top-nm{font-family:'Nunito',sans-serif;font-weight:900;color:var(--pk);font-size:.95rem;}
.top-role{font-size:.68rem;color:var(--tl);}
.btn{padding:8px 16px;border-radius:20px;border:none;cursor:pointer;font-size:.8rem;
  font-weight:800;font-family:'Nunito',sans-serif;transition:all .2s;}
.btn-out{background:#fff;border:2px solid var(--pk3);color:var(--tl);}
.btn-out:hover{border-color:var(--pk);color:var(--pk);}
.btn-pk{background:linear-gradient(135deg,#FF5C7D,var(--pk));color:#fff;}

/* CONTENT */
.wrap{max-width:860px;margin:0 auto;padding:22px 16px;}
.card{background:#fff;border:2.5px solid var(--pk3);border-radius:20px;
  padding:22px;box-shadow:var(--sh);margin-bottom:18px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--pk),var(--pk2),var(--y),var(--pk2),var(--pk));
  background-size:200%;animation:sh 3s linear infinite;}
.card-title{font-family:'Nunito',sans-serif;font-weight:900;color:var(--pk);
  font-size:1.05rem;margin-bottom:16px;display:flex;align-items:center;gap:8px;}

/* REPORT CARD */
.rep-card{background:var(--pk4);border:2px solid var(--pk3);border-radius:16px;
  padding:18px;margin-bottom:16px;}
.rep-date{font-family:'Nunito',sans-serif;font-weight:900;color:var(--pk);
  font-size:.95rem;margin-bottom:12px;display:flex;align-items:center;gap:8px;}

/* SECTION BLOCK */
.rblock{margin-bottom:14px;background:#fff;border-radius:12px;padding:14px;
  border:1.5px solid var(--pk3);}
.rblock-title{font-size:.78rem;font-weight:800;color:var(--pk);margin-bottom:8px;
  font-family:'Nunito',sans-serif;display:flex;align-items:center;gap:6px;
  padding-bottom:6px;border-bottom:1.5px dashed var(--pk3);}
.rblock-content{font-size:.84rem;line-height:1.8;color:var(--t);}
.rblock-row{display:flex;gap:8px;margin-bottom:4px;}
.rblock-label{color:var(--tl);font-weight:700;min-width:60px;}
.tag{display:inline-flex;background:rgba(255,143,163,.1);color:var(--pk);
  border:1.5px solid var(--pk3);border-radius:8px;padding:2px 9px;
  font-size:.72rem;font-weight:700;margin:2px;}

/* DISINFECT / SERVICE CHECKS */
.check-list{display:flex;flex-wrap:wrap;gap:6px;}
.check-ok{display:inline-flex;align-items:center;gap:4px;background:var(--g2);
  color:#1A7A4A;border:1.5px solid var(--g);border-radius:8px;padding:4px 10px;font-size:.76rem;font-weight:700;}

/* PET SECTION */
.pet-section{background:#fff;border:2px solid var(--pk2);border-radius:14px;
  padding:14px;margin-bottom:12px;}
.pet-name{font-family:'Nunito',sans-serif;font-weight:900;color:var(--pk);
  font-size:.95rem;margin-bottom:10px;}
.pet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:400px){.pet-grid{grid-template-columns:1fr;}}
.pet-item{background:var(--pk4);border-radius:8px;padding:8px 10px;}
.pet-item-label{font-size:.68rem;color:var(--tl);font-weight:700;margin-bottom:2px;}
.pet-item-val{font-size:.82rem;font-weight:700;color:var(--t);}

/* PHOTOS */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:8px;}
.photo-thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;
  border:2.5px solid var(--pk3);cursor:pointer;transition:transform .2s;}
.photo-thumb:hover{transform:scale(1.05);border-color:var(--pk);}
.photo-carousel{position:relative;width:100%;margin-top:8px;overflow:hidden;border-radius:14px;background:#000;aspect-ratio:1;touch-action:pan-y;}
.photo-carousel-track{display:flex;transition:transform .32s cubic-bezier(.4,0,.2,1);height:100%;will-change:transform;}
.photo-carousel-slide{flex:0 0 100%;height:100%;position:relative;}
.photo-carousel-slide img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block;}
.photo-carousel-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);border:none;border-radius:50%;width:36px;height:36px;font-size:1.1rem;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:opacity .2s;}
.photo-carousel-btn:hover{background:#fff;}
.photo-carousel-prev{left:8px;}
.photo-carousel-next{right:8px;}
.photo-carousel-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:3;}
.photo-carousel-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;transition:background .2s;}
.photo-carousel-dot.active{background:#fff;}
.photo-carousel-count{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.45);color:#fff;font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:8px;z-index:3;}
.photo-group-label{font-size:.74rem;font-weight:700;color:var(--tl);margin:8px 0 4px;font-family:'Nunito',sans-serif;}

/* COMPARE PHOTOS */
.compare-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.compare-item{text-align:center;}
.compare-item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:2.5px solid var(--pk3);}
.compare-item .clabel{font-size:.7rem;color:var(--tl);margin-top:4px;font-weight:700;}

/* VIDEO */
.video-player{width:100%;max-height:240px;border-radius:12px;border:2.5px solid var(--pk3);margin-top:8px;}

/* PHOTO LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;
  align-items:center;justify-content:center;cursor:zoom-out;}
.lightbox.show{display:flex;}
.lightbox img{max-width:95vw;max-height:90vh;border-radius:14px;object-fit:contain;}

/* NO REPORT */
.no-rep{text-align:center;padding:36px;color:var(--tl);font-size:.88rem;line-height:1.8;}

.badge{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:800;font-family:'Nunito',sans-serif;}
.b-ok{background:var(--g2);color:#1A7A4A;border:2px solid var(--g);}
.b-wait{background:#FFF8D0;color:#8B6800;border:2px solid var(--y);}

/* ── DATE ACCORDION (reports) ── */
.date-accordion{border:1.5px solid var(--pk3);border-radius:14px;margin-bottom:10px;overflow:hidden;background:#fff;}
.date-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;background:var(--pk4);transition:background .2s;}
.date-header:hover{background:#FFE8F0;}
.date-header-l{font-family:'Nunito',sans-serif;font-weight:900;color:var(--pk);font-size:.88rem;}
.date-arrow{font-size:.85rem;color:var(--pk);transition:transform .25s;}
.date-arrow.open{transform:rotate(180deg);}
.date-body{display:none;padding:12px;}
.date-body.open{display:block;}
/* ── SLOT TABS ── */
.slot-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.slot-tab{padding:7px 16px;border:2px solid var(--pk3);border-radius:20px;background:#fff;font-size:.78rem;font-weight:800;font-family:'Nunito',sans-serif;color:var(--tl);cursor:pointer;transition:all .18s;}
.slot-tab.on{background:linear-gradient(135deg,var(--pk4),#FFE8F0);border-color:var(--pk);color:var(--pk);}
.slot-panel.hidden{display:none;}
/* ── DATE ACCORDION (reports) END ── */
.order-accordion{border:2.5px solid var(--pk3);border-radius:20px;margin-bottom:16px;overflow:hidden;background:#fff;box-shadow:var(--sh);}
.order-accordion::before{content:'';display:block;height:5px;background:linear-gradient(90deg,var(--pk),var(--pk2),var(--y),var(--pk2),var(--pk));background-size:200%;animation:sh 3s linear infinite;}
.order-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;background:#fff;transition:background .2s;}
.order-header:hover{background:var(--pk4);}
.order-num{font-family:'Nunito',sans-serif;font-weight:900;color:var(--pk);font-size:1rem;}
.order-dates{font-size:.78rem;color:var(--tl);font-weight:700;}
.order-arrow{font-size:1rem;color:var(--pk);transition:transform .25s;flex-shrink:0;}
.order-arrow.open{transform:rotate(180deg);}
.order-body{display:none;padding:20px;border-top:2px dashed var(--pk3);}
.order-body.open{display:block;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.83rem;margin-bottom:6px;}
@media(max-width:420px){.info-grid{grid-template-columns:1fr;}}
.info-label{font-size:.7rem;color:var(--tl);font-weight:700;font-family:'Nunito',sans-serif;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
.info-val{font-weight:700;color:var(--t);}
.sitter-tag{display:inline-flex;align-items:center;gap:4px;background:var(--pk4);border:1.5px solid var(--pk3);border-radius:8px;padding:3px 10px;font-size:.78rem;font-weight:800;color:var(--pk);margin:2px;}
.section-sub-title{font-family:'Nunito',sans-serif;font-weight:900;color:var(--pk);font-size:.92rem;margin:18px 0 10px;display:flex;align-items:center;gap:6px;}
/* ── REVIEW SECTION ── */
.rv-hero{
  background:linear-gradient(135deg,#FFF0F5 0%,#FFF9E8 50%,#FFF0F5 100%);
  border:2.5px solid var(--pk3);border-radius:20px;padding:28px 22px;
  text-align:center;position:relative;overflow:hidden;margin-bottom:18px;
}
.rv-hero::before{
  content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;
  background:radial-gradient(circle,rgba(255,143,163,.15),transparent 70%);
  border-radius:50%;pointer-events:none;
}
.rv-hero::after{
  content:'';position:absolute;bottom:-30px;left:-30px;width:110px;height:110px;
  background:radial-gradient(circle,rgba(255,224,102,.18),transparent 70%);
  border-radius:50%;pointer-events:none;
}
.rv-emoji-row{font-size:2rem;margin-bottom:10px;line-height:1;letter-spacing:6px;}
.rv-hero-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.25rem;
  color:var(--pk);margin-bottom:8px;}
.rv-hero-sub{font-size:.84rem;color:var(--tl);line-height:1.7;margin-bottom:18px;}
.rv-reward-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#FFB800,#FF9500);
  color:#fff;border-radius:24px;padding:10px 22px;
  font-family:'Nunito',sans-serif;font-weight:900;font-size:.95rem;
  box-shadow:0 6px 18px rgba(255,184,0,.35);
  animation:pulse-y 2.2s ease-in-out infinite;
}
@keyframes pulse-y{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
/* Star rating buttons */
.rv-stars{display:flex;justify-content:center;gap:8px;margin:18px 0 8px;}
.rv-star{width:46px;height:46px;border:2.5px solid var(--pk3);border-radius:14px;
  background:#fff;font-size:1.4rem;cursor:pointer;transition:all .18s;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rv-star.on{background:linear-gradient(135deg,#FFE066,#FFB800);border-color:#FFB800;
  transform:scale(1.12);box-shadow:0 4px 12px rgba(255,184,0,.3);}
.rv-star:hover{transform:scale(1.1);border-color:var(--pk);}
.rv-star-label{font-size:.76rem;color:var(--tl);text-align:center;margin-bottom:16px;
  font-weight:700;min-height:1.2em;transition:color .2s;}
/* Sitter pills */
.rv-sitter-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;}
.rv-sitter{padding:8px 16px;border:2.5px solid var(--pk3);border-radius:24px;
  background:#fff;font-size:.82rem;font-weight:800;cursor:pointer;transition:all .18s;
  font-family:'Nunito',sans-serif;color:var(--tl);}
.rv-sitter.on{background:linear-gradient(135deg,var(--pk4),#FFF0F5);
  border-color:var(--pk);color:var(--pk);box-shadow:0 3px 10px rgba(255,143,163,.2);}
/* Best select chips */
.rv-best-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
@media(max-width:480px){.rv-best-grid{grid-template-columns:1fr;}}
.rv-chip{padding:10px 12px;border:2px solid var(--pk3);border-radius:12px;
  background:#fff;font-size:.77rem;cursor:pointer;transition:all .15s;
  text-align:center;line-height:1.4;color:var(--tl);font-weight:600;}
.rv-chip.on{background:linear-gradient(135deg,rgba(255,143,163,.1),rgba(255,224,102,.1));
  border-color:var(--pk);color:var(--pk);font-weight:800;}
/* Input fields */
.rv-input{width:100%;padding:12px 16px;border:2.5px solid var(--pk3);border-radius:14px;
  font-family:inherit;font-size:.88rem;color:var(--t);background:#fff;outline:none;
  transition:border .2s;margin-bottom:12px;}
.rv-input:focus{border-color:var(--pk);}
.rv-section-label{font-size:.72rem;font-weight:800;color:var(--tl);
  font-family:'Nunito',sans-serif;margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase;}
/* Submit btn */
.rv-submit{
  width:100%;padding:16px;margin-top:8px;
  background:linear-gradient(135deg,#FFB800,#FF9500);
  color:#fff;border:none;border-radius:16px;
  font-size:1rem;font-weight:900;font-family:'Nunito',sans-serif;
  cursor:pointer;transition:all .2s;
  box-shadow:0 8px 24px rgba(255,184,0,.35);
  position:relative;overflow:hidden;
}
.rv-submit::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
}
.rv-submit:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,184,0,.4);}
.rv-submit:active{transform:translateY(0);}
/* Coupon result */
.rv-coupon{
  margin-top:20px;
  background:linear-gradient(135deg,#FFFDE7,#FFF8E1);
  border:3px dashed #FFB800;border-radius:20px;padding:28px 22px;
  text-align:center;display:none;
  animation:fadein .5s ease;
}
@keyframes fadein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.rv-coupon-amount{
  font-size:3rem;font-weight:900;color:#B8860B;
  font-family:'Nunito',sans-serif;line-height:1;margin:12px 0 6px;
}
.rv-coupon-code{
  font-family:monospace;font-size:.88rem;color:var(--tl);
  background:#fff;border:1.5px solid #FFD700;border-radius:10px;
  padding:10px 18px;display:inline-block;margin:10px 0;letter-spacing:2px;
}
/* Referral section */
.rv-ref{
  margin-top:20px;padding:22px;
  background:linear-gradient(135deg,#FFF0F5,#F5EEFF);
  border:2.5px solid var(--pk3);border-radius:20px;
  text-align:center;position:relative;overflow:hidden;
}
.rv-ref::before{
  content:'🌸';position:absolute;top:-8px;right:14px;font-size:2.4rem;
  opacity:.18;pointer-events:none;
}
.rv-ref-code{
  font-size:1.5rem;font-weight:900;color:var(--pk);
  letter-spacing:8px;font-family:monospace;
  background:#fff;border:2.5px dashed var(--pk3);border-radius:14px;
  padding:14px 20px;margin:12px 0;display:block;
}
.rv-copy-btn{
  width:100%;padding:12px;
  background:linear-gradient(135deg,var(--pk),#FF5C7D);
  color:#fff;border:none;border-radius:14px;
  font-size:.9rem;font-weight:900;font-family:'Nunito',sans-serif;
  cursor:pointer;box-shadow:0 5px 16px rgba(255,92,125,.3);
  transition:all .2s;
}
.rv-copy-btn:hover{transform:translateY(-2px);}


.detail-section{margin-top:14px;}
.detail-toggle-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 14px;background:var(--pk4);border:1.5px solid var(--pk3);border-radius:12px;cursor:pointer;font-size:.82rem;font-weight:900;color:var(--pk);box-sizing:border-box;margin-bottom:2px;}
.detail-toggle-btn:hover{background:var(--pk3);}
.detail-toggle-arrow{transition:transform .22s;font-size:.8rem;}
.detail-toggle-arrow.open{transform:rotate(180deg);}
.detail-body{display:none;}
.detail-body.open{display:block;}
/* Lightbox */
.lb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99999;align-items:center;justify-content:center;flex-direction:column;}
.lb-overlay.show{display:flex;}
.lb-overlay img{max-width:90vw;max-height:80vh;border-radius:10px;object-fit:contain;}
.lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:2rem;cursor:pointer;font-weight:900;line-height:1;}
.lb-download{margin-top:14px;padding:10px 24px;background:linear-gradient(135deg,var(--pk),var(--pk2));color:#fff;border:none;border-radius:10px;font-weight:800;font-size:.9rem;cursor:pointer;}
.clickable-img{cursor:pointer;transition:transform .2s;}
.clickable-img:hover{transform:scale(1.02);}
</style>

// ── 解析 assigned_to 欄位，取出保母名稱列表 ──
function parseAssignedSitters(assignedTo){
  if(!assignedTo||assignedTo==='安排中')return [];
  try{
    const arr=typeof assignedTo==='string'?JSON.parse(assignedTo):assignedTo;
    if(!Array.isArray(arr))return [String(assignedTo)];
    // [{date,slot,sitter,transport},...] 格式
    const sitters=[...new Set(arr.map(x=>x.sitter).filter(Boolean))];
    return sitters;
  }catch(e){
    // 可能是舊格式字串
    if(typeof assignedTo==='string'&&assignedTo.includes('"sitter"')){
      const m=assignedTo.match(/"sitter":"([^"]+)"/g);
      if(m)return [...new Set(m.map(s=>s.replace(/"sitter":"|"/g,'')))];
    }
    return assignedTo?[assignedTo]:[];
  }
}

// ── 解析時段指派，生成人類可讀文字 ──
function parseAssignedSummary(assignedTo){
  if(!assignedTo||assignedTo==='安排中')return '安排中';
  try{
    const arr=typeof assignedTo==='string'?JSON.parse(assignedTo):assignedTo;
    if(!Array.isArray(arr)||!arr.length)return String(assignedTo);
    const sitters=[...new Set(arr.map(x=>x.sitter).filter(Boolean))];
    return sitters.join('、')||'安排中';
  }catch(e){
    return typeof assignedTo==='string'&&assignedTo.length<30?assignedTo:'安排中';
  }
}

  }).join('');

    +'<div class="photo-carousel-count"><span id="'+id+'-cur">1</span>/'+photos.length+'</div>'

function carouselGoTo(id, idx){
  var el=document.getElementById(id);
  if(!el)return;
  var total=parseInt(el.dataset.total)||1;
  idx=Math.max(0,Math.min(idx,total-1));
  el.dataset.idx=idx;
  var track=document.getElementById(id+'-track');
  if(track) track.style.transform='translateX(-'+( idx*100)+'%)';
  var cur=document.getElementById(id+'-cur');
  if(cur) cur.textContent=idx+1;
  var dots=document.querySelectorAll('#'+id+'-dots .photo-carousel-dot');
  dots.forEach(function(d,i){d.classList.toggle('active',i===idx);});
}
function carouselPrev(id){var el=document.getElementById(id);if(el)carouselGoTo(id,parseInt(el.dataset.idx||0)-1);}
function carouselNext(id){var el=document.getElementById(id);if(el)carouselGoTo(id,parseInt(el.dataset.idx||0)+1);}

  document.addEventListener('touchend',function(e){
    if(!startId)return;

var SLOT_LABEL_MAP={morning:'🌅 早上',noon:'☀️ 中午',evening:'🌙 晚上'};

async function loadOrderReports(bookId){
  var container=document.getElementById(`reps-${bookId}`);
  if(!container)return;
  try{
    const reps=(await getReps(bookId)).sort((a,b)=>a.ts-b.ts); // 舊→新
    if(!reps.length){
      container.innerHTML=`<div class="no-rep" style="padding:16px;">📝 回報尚未上傳，保母服務後會立即更新 🌸</div>`;
      return;
    }

  }catch(e){
    container.innerHTML='<div class="no-rep" style="padding:16px;color:red;">錯誤：'+e.message+'</div>';
    console.error('loadReps error:',e);
  }
}


function buildReportAccordion(reps,bookId){
  if(!reps||!reps.length) return '<div class="no-rep">尚無回報</div>';
  var byDate={};
  reps.forEach(function(r){
    var d=(r&&r.date)||'未知日期';
    if(!byDate[d]) byDate[d]=[];
    byDate[d].push(r);
  });
  var dates=Object.keys(byDate).sort();
  return dates.map(function(date,di){
    var dayReps=byDate[date]||[];
    var isOpenDefault=(di===dates.length-1);
    var dKey='dr-'+bookId+'-'+date.replace(/-/g,'');
    var innerHtml='';
    if(dayReps.length===1){
      try{ innerHtml=renderReport(dayReps[0]); }
      catch(e){ innerHtml='<div style="color:red;padding:8px;">回報顯示錯誤：'+e.message+'</div>'; }
    } else {
      var tabs=dayReps.map(function(r,si){
        var slot=r&&r.slot;
        var slotLabel=(slot&&SLOT_LABEL_MAP[slot])||(r&&r.timeStart)||('第'+(si+1)+'次');
        return '<button class="slot-tab'+(si===0?' on':'')+'" data-dkey="'+dKey+'" data-si="'+si+'">'+slotLabel+'</button>';
      }).join('');
      var panels=dayReps.map(function(r,si){
        var html='';
        try{ html=renderReport(r); }
        catch(e){ html='<div style="color:red;padding:8px;">'+e.message+'</div>'; }
        return '<div class="slot-panel'+(si===0?'':' hidden')+'" id="sp-'+dKey+'-'+si+'">'+html+'</div>';
      }).join('');
      innerHtml='<div class="slot-tabs" id="stabs-'+dKey+'">'+tabs+'</div>'+panels;
    }
    var openClass=isOpenDefault?' open':'';
    return '<div class="date-accordion" id="'+dKey+'-wrap">'
      +'<div class="date-header" data-dkey2="'+dKey+'">'
      +'<span class="date-header-l">📅 '+date+'（'+dayReps.length+'筆回報）</span>'
      +'<span class="date-arrow'+openClass+'" id="'+dKey+'-arrow">▼</span>'
      +'</div>'
      +'<div class="date-body'+openClass+'" id="'+dKey+'-body">'+innerHtml+'</div>'
      +'</div>';
  }).join('');
}

function setStarFor(bookId,n){
  var container=document.getElementById(`stars-${bookId}`);

  var map={1:'★',2:'★★',3:'★★★',4:'★★★★',5:'★★★★★'};

// ── 提交好評 ──
async function submitReviewFor(bookId){
  var allBooks=await getB();
  var bk=allBooks.find(x=>x.id===bookId);
  var petName=bk?.petData?.length?bk.petData.map(p=>p.name).join('、'):(bk?.petName||'毛孩');
  var author=document.getElementById(`author-${bookId}`).value||`${petName}主人`;
  var rating=document.getElementById(`rating-${bookId}`).value||'★★★★★';
  var comment=document.getElementById(`comment-${bookId}`).value||'';
  var bestEls=document.getElementById(`best-${bookId}`)?.querySelectorAll('.rv-chip.on')||[];
  var best=[...bestEls].map(e=>e.textContent.trim()).join('、');

  // 生成短券碼（6位英數）
  var code=Math.random().toString(36).substring(2,8).toUpperCase();

  // 儲存 review 到 Supabase
  try{
    await dbInsertReview({
      book_id:bookId,
      pet_name:petName,
      pet_type:(bk?.catCount||0)>0?'🐱 貓咪':'🐶 狗狗',
      sitter:parseAssignedSitters(bk?.assignedTo).join('、')||'保母',
      rating,
      best,
      comment,
      author,
      coupon_code:code,
      ts:Date.now()
    });
  }catch(e){console.error('review save error',e);}

  // 儲存券碼
  try{
    const now=new Date();
    const today=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    const expire=new Date(now);expire.setFullYear(expire.getFullYear()+1);
    const expStr=`${expire.getFullYear()}${String(expire.getMonth()+1).padStart(2,'0')}${String(expire.getDate()).padStart(2,'0')}`;
    await dbInsertCoupon({code,pet_name:petName,amount:50,created:today,expire:expStr,used:false,author});
  }catch(e){console.error('coupon save error',e);}

  // 更新前台好評（prepend 到 index.html REVIEWS 陣列無法直接做，改為存 Supabase 讓前台讀取）
  // 已存入 reviews 表，前台下次載入即顯示

  // 替換表單為已填結果
  var formEl=document.getElementById(`rvForm-${bookId}`);
  if(formEl){
    const rv={rating,best,comment,author,coupon_code:code};
    formEl.outerHTML=buildReviewDoneHTML(rv,bookId).replace(`<div class="section-sub-title">💬 我的好評</div>`,'').trimStart();
    // 重新插入 section title
    const body=document.getElementById(`body-${bookId}`);
    if(body){
      const done=body.querySelector(`[id^="rvForm-"]`);
      if(!done){
        // form was replaced, find the new content
        const newDoneHTML=buildReviewDoneHTML(rv,bookId);
        const rvSection=body.querySelector('.section-sub-title:last-of-type');
        if(rvSection)rvSection.insertAdjacentHTML('afterend',newDoneHTML.replace('<div class="section-sub-title">💬 我的好評</div>',''));
      }
    }
  }

  alert('🎉 感謝您的好評！$50 折抵券碼：'+code);
}

          ${g.before?`<div class="compare-item"><img src="${g.before}" onclick="openLB(this)"><div class="clabel">清潔前</div></div>`:''}
          ${g.after?`<div class="compare-item"><img src="${g.after}" onclick="openLB(this)"><div class="clabel">清潔後 ✅</div></div>`:''}
        </div>
      </div>`).join('');
    if(groupHtml.trim()){
      html+=`<div class="rblock"><div class="rblock-title">📸 清潔前後對比</div>${groupHtml}</div>`;
    }
  }

  // 安全巡檢
  if(r.safety?.length){
    html+=`<div class="rblock">
      <div class="rblock-title">🔐 離開前環境安全巡檢</div>
      <div class="check-list">${r.safety.map(s=>`<span class="check-ok">✔ ${s}</span>`).join('')}</div>

  }

  // 保母心情日記
  if(r.diary){
    html+=`<div class="rblock" style="background:linear-gradient(135deg,#FFF0F5,#FFFAF0);">
      <div class="rblock-title">💌 保母心情日記</div>
      <div class="rblock-content" style="font-style:italic;line-height:1.8;">${r.diary}</div>
    </div>`;
  }

  html+=`</div>`;
  return html;
}



// ── 費用計算（常數已移入 ownerCalcDetail 函式內）──

function ownerCalcDetail(bk){
  // 常數內嵌，避免 TDZ 問題
  var SVC_P={companion:300,walk:200,both:500};
  var HOL_P={companion:450,walk:350,both:750};
  var CNY_P={companion:600,walk:500,both:1000};
  var CNY_SET=new Set(["2026-02-14","2026-02-15","2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20","2026-02-21","2026-02-22"]);
  var HOL_SET=new Set(["2026-01-01","2026-02-27","2026-02-28","2026-03-01","2026-04-03","2026-04-04","2026-04-05","2026-04-06","2026-05-01","2026-05-02","2026-05-03","2026-06-19","2026-06-20","2026-06-21","2026-09-25","2026-09-26","2026-09-27","2026-09-28","2026-10-09","2026-10-10","2026-10-11","2026-12-25","2026-12-26","2026-12-27"]);
  var ADDON_P={餵藥:50,點藥:50,舒緩按摩:100,剪指甲:80,協助排便導尿:80,收信:30,澆花:30,倒垃圾:50};
  var SN={companion:'到府陪伴',walk:'散步服務',both:'陪伴＋散步'};

  var raw=bk.assignedTo||'';
  var slots=[];
  if(raw){try{
    var p=JSON.parse(raw);
    if(Array.isArray(p)&&p.length){
      if(p[0].slot!==undefined) slots=p;
      else if(p[0].slots!==undefined) p.forEach(function(d){(d.slots||[]).forEach(function(s){slots.push({date:d.date,slot:s});});});
    }
  }catch(e){}}

  var total=slots.length||Math.max(1,(bk.tpd||1)*Math.max(1,Math.round((new Date((bk.endDate||'')+' 00:00:00')-new Date((bk.startDate||'')+' 00:00:00'))/86400000)+1));
  var cny=0,hol=0,norm=0;
  slots.forEach(function(s){
    if(CNY_SET.has(s.date)) cny++;
    else if(HOL_SET.has(s.date)) hol++;
    else norm++;
  });
  if(!slots.length) norm=total;

  var rows=[];
  (bk.services||[]).forEach(function(k){
    var sn=SN[k]||k;
    if(norm>0) rows.push({label:sn+'（平日）',price:SVC_P[k]||0,times:norm,sub:(SVC_P[k]||0)*norm});
    if(hol>0)  rows.push({label:sn+'（連假🎊）',price:HOL_P[k]||0,times:hol,sub:(HOL_P[k]||0)*hol});
    if(cny>0)  rows.push({label:sn+'（春節🧧）',price:CNY_P[k]||0,times:cny,sub:(CNY_P[k]||0)*cny});
  });
  (bk.addons||[]).forEach(function(a){
    var m2=a.match(/^(.+?)[×x](\d+)/);
    var nm=m2?m2[1].trim():a;
    var qty=m2?parseInt(m2[2]):1;
    var p2=(ADDON_P[nm]||50)*qty;
    rows.push({label:a,price:p2,times:total,sub:p2*total});
  });
  var tp=(bk.catCount||0)+(bk.dogCount||0);
  if(tp>3){var eu=50*(tp-3);rows.push({label:'第4隻起加收（超額'+(tp-3)+'隻）',price:eu,times:total,sub:eu*total});}
  if(bk.urgent>0) rows.push({label:'急件加收',price:bk.urgent,times:1,sub:bk.urgent});
  if(bk.transport>0) rows.push({label:'車馬費',price:bk.transport,times:total,sub:bk.transport*total});

  var adjs=Array.isArray(bk.manualAdjs)?bk.manualAdjs:(bk.manualAdj?[{amount:bk.manualAdj,reason:'調整'}]:[]);
  var grandTotal=rows.reduce(function(s,r){return s+r.sub;},0)+adjs.reduce(function(s,a){return s+(parseInt(a.amount)||0);},0);
  return {rows:rows,adjs:adjs,grandTotal:grandTotal,total:total};
}

    html.push('</div>');
  }
  if(feeTable){
    html.push('<div>');
    html.push('<div style="font-size:.74rem;font-weight:800;color:var(--tl);margin-bottom:6px;">💰 服務費用表</div>');
    if(feeTable.startsWith('data:image')){

      html.push('<div style="display:flex;gap:8px;"><a href="'+feeTable+'" target="_blank" style="flex:1;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--pk4);border:1.5px solid var(--pk3);border-radius:10px;text-decoration:none;color:var(--pk);font-weight:800;font-size:.84rem;">📄 查看費用表</a><a href="'+feeTable+'" download="費用表.pdf" style="padding:10px 14px;background:var(--pk);color:#fff;border-radius:10px;font-weight:800;font-size:.84rem;text-decoration:none;">⬇️</a></div>');
    }
    html.push('</div>');
  }
  html.push('</div></div>');
  return html.join('');
}
async function initReferralCode(){
  if(!currentBookId)return;
  try{
    const _opws=await dbGetOwnerPws();
    const pw=_opws[currentBookId]||'';
    // Generate ref code seed from pw or bookId
    const seed=pw||String(currentBookId);
    const refs=await dbGetRefCodes();
    // Find existing code for this bookId
    let myCode=Object.keys(refs).find(k=>refs[k]&&String(refs[k].bookId)===String(currentBookId));
    if(!myCode){
      // Create new unique code: REF + seed chars + random
      const randPart=Math.random().toString(36).substring(2,6).toUpperCase();
      myCode='REF-'+seed.slice(-3)+randPart;
      const bk=(await getB()).find(x=>x.id===currentBookId);
      refs[myCode]={
        bookId:currentBookId,
        owner:bk?.ownerName||'飼主',
        usedBy:null,usedAt:null,
        created:new Date().toISOString()
      };
      await dbInsertRefCode(myCode,currentBookId,bk?.ownerName||'飼主');
    }
    const el=document.getElementById('myRefCode');
    if(el) el.textContent=myCode;

    // Show referral history if any successful referrals
    const _allO=await getB();
  const bk2=_allO.find(x=>x.id===currentBookId);
    const ownerName=bk2?.ownerName||'';
    const successRefs=Object.entries(refs).filter(([k,v])=>v&&v.owner===ownerName&&v.usedBy);
    const hist=document.getElementById('refHistory');
    if(hist){
      if(successRefs.length>0){
        hist.innerHTML=`<div style="background:var(--g2);border:1.5px solid var(--g);border-radius:10px;padding:10px 14px;font-size:.8rem;color:#1A7A4A;margin-top:8px;font-weight:700;">
          ✅ 已成功推薦 ${successRefs.length} 位好友！累積獎勵 $${successRefs.length*100}
        </div>`;
      } else {
        hist.innerHTML='';
      }
    }
  }catch(e){console.error('initReferralCode error:',e);}
}
