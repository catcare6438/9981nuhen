<script>
const SUPA_KEY='neon_worker_auth';
// ══════════════════════════════════════════════
// Supabase → Cloudflare Worker Polyfill
// ══════════════════════════════════════════════
// ── Cloudflare Worker 轉接頭（格式A：直接陣列）──
const WORKER_URL = 'https://catwoli-api.catwoli6644.workers.dev';

async function _wfetch(path, opts){
  const res = await fetch(WORKER_URL + path, opts);
  const j = await res.json();
  // Worker 直接回傳陣列或物件
  if(Array.isArray(j)) return {data:j, error:null};
  if(j && j.error) return {data:null, error:{message:j.error||j.message}};
  if(j && j.rows) return {data:j.rows, error:null};
  // single row object
  return {data:j, error:null};
}

const _supa = {
  from: (table) => ({
    select: (cols) => ({
      order: (col, opts) => ({
        then: async (cb) => cb(await _wfetch('/'+table+'?_order='+col+'&_asc='+(!!(opts&&opts.ascending)))),
        eq: (c2,v) => ({ then: async (cb) => cb(await _wfetch('/'+table+'?'+c2+'='+encodeURIComponent(v)+'&_order='+col)) }),
        limit: (n) => ({ single: () => ({ then: async (cb) => { const r=await _wfetch('/'+table+'?_order='+col+'&_limit='+n); cb({data:Array.isArray(r.data)?r.data[0]:r.data,error:r.error}); } }) })
      }),
      eq: (col,val) => ({
        then: async (cb) => cb(await _wfetch('/'+table+'?'+col+'='+encodeURIComponent(val))),
        limit: (n) => ({
          then: async (cb) => cb(await _wfetch('/'+table+'?'+col+'='+encodeURIComponent(val)+'&_limit='+n)),
          single: () => ({ then: async (cb) => { const r=await _wfetch('/'+table+'?'+col+'='+encodeURIComponent(val)+'&_limit=1'); cb({data:Array.isArray(r.data)?r.data[0]:r.data,error:r.error}); } })
        }),
        single: () => ({ then: async (cb) => { const r=await _wfetch('/'+table+'?'+col+'='+encodeURIComponent(val)+'&_limit=1'); cb({data:Array.isArray(r.data)?r.data[0]:r.data,error:r.error}); } })
      }),
      then: async (cb) => cb(await _wfetch('/'+table)),
      limit: (n) => ({
        then: async (cb) => cb(await _wfetch('/'+table+'?_limit='+n)),
        single: () => ({ then: async (cb) => { const r=await _wfetch('/'+table+'?_limit=1'); cb({data:Array.isArray(r.data)?r.data[0]:r.data,error:r.error}); } })
      }),
      single: () => ({ then: async (cb) => { const r=await _wfetch('/'+table+'?_limit=1'); cb({data:Array.isArray(r.data)?r.data[0]:r.data,error:r.error}); } })
    }),
    insert: (rows) => ({
      then: async (cb) => cb(await _wfetch('/'+table, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Array.isArray(rows)?rows[0]:rows)})),
      select: () => ({ then: async (cb) => { const r=await _wfetch('/'+table,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Array.isArray(rows)?rows[0]:rows)}); cb({data:r.data?[r.data]:[],error:r.error}); } })
    }),
    upsert: (rows, opts) => ({
      then: async (cb) => {
        const row=Array.isArray(rows)?rows[0]:rows;
        const conflict=opts&&opts.onConflict?'&_conflict='+opts.onConflict:'';
        cb(await _wfetch('/'+table+'?_upsert=1'+conflict,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)}));
      }
    }),
    update: (fields) => ({
      eq: (col,val) => ({
        then: async (cb) => cb(await _wfetch('/'+table+'?'+col+'='+encodeURIComponent(val),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(fields)}))
      })
    }),
    delete: () => ({
      eq: (col,val) => ({
        then: async (cb) => { try{await fetch(WORKER_URL+'/'+table+'?'+col+'='+encodeURIComponent(val),{method:'DELETE'});cb({error:null});}catch(e){cb({error:e});} }
      })
    })
  })
};
class _SupaQuery {
  constructor(table){
    this._t=table; this._f={}; this._sel='*';
    this._lim=null; this._m='select'; this._data=null; this._sngl=false;
  }
  select(c){this._sel=c;return this;}
  eq(k,v){this._f[k]=v;return this;}
  limit(n){this._lim=n;return this;}
  order(col,opt){return this;}
  insert(rows){this._m='insert';this._data=Array.isArray(rows)?rows[0]:rows;return this;}
  update(fields){this._m='update';this._data=fields;return this;}
  upsert(rows,opt){this._m='upsert';this._data=Array.isArray(rows)?rows[0]:rows;this._uopt=opt;return this;}
  delete(){this._m='delete';return this;}
  single(){this._sngl=true;return this;}

  then(resolve,reject){
    const run = async () => {
      const t=this._t, f=this._f;
      let data;
      try{
        if(this._m==='insert'){
          data = await _workerFetch(t+'/insert', {fields:this._data});
        } else if(this._m==='update'){
          const fk=Object.keys(f)[0];
          data = await _workerFetch(t+'/update', {filterKey:fk, filterVal:f[fk], fields:this._data});
        } else if(this._m==='upsert'){
          data = await _workerFetch(t+'/upsert', {...this._data, ...(this._uopt||{})});
        } else if(this._m==='delete'){
          const fk=Object.keys(f)[0];
          data = await _workerFetch(t+'/delete', {filterKey:fk, filterVal:f[fk]});
        } else {
          // select
          data = await _workerFetch(t+'/list', {filters:f, limit:this._lim});
          if(Array.isArray(data)){
            Object.entries(f).forEach(([k,v])=>{
              data=data.filter(r=>String(r[k])===String(v));
            });
            if(this._lim) data=data.slice(0,this._lim);
          }
        }
        const result = this._sngl?(Array.isArray(data)?data[0]:data):data;
        resolve({data:result, error:null});
      }catch(e){
        resolve({data:null, error:{message:e.message}});
      }
    };
    run();
  }
}

// Safe error message extractor — never touches Headers or non-serialisable fields
function _errMsg(e){
  if(!e) return 'unknown error';
  if(typeof e==='string') return e;
  // Extract only plain-string fields
  const msg=e.message||e.msg||'';
  const code=e.code||e.status_code||'';
  const hint=e.hint||e.details||'';
  return [msg,code?`[${code}]`:'',hint].filter(Boolean).join(' ').trim()||'Supabase error';
}

<script>
// ══════════════════════════════════════════════
// 保母密碼系統
// SITTER_INIT_PWS = 初始密碼（永不改變，hardcoded）
// localStorage 'sitterPwChanged' = 保母自行更改後的新密碼
// 登入驗證：先查 changed，沒有則用 INIT
// ══════════════════════════════════════════════

// ── DATE SLOT DISPLAY ──
function formatDateSlots(dateSlotData){
  if(!dateSlotData||!dateSlotData.length) return '';
  const SLOT_NAMES={morning:'早上🌅',noon:'中午☀️',evening:'晚上🌙'};
  const dayNames=['日','一','二','三','四','五','六'];
  return dateSlotData.map(d=>{
    const day=new Date(d.date+'T00:00:00');
    const slots=(d.slots||[]).map(s=>SLOT_NAMES[s]||s).join('、');
    return `${d.date.slice(5)}(${dayNames[day.getDay()]}) ${slots}`;
  }).join(' ／ ');
}

function renderDateSlotsHtml(dateSlotData){
  if(!dateSlotData||!dateSlotData.length) return '<span style="color:var(--tl);">—</span>';
  const SLOT_COLORS={morning:'background:#FFF8D0;color:#8B6800;border:1px solid #FFB800;',noon:'background:#FFF0F5;color:var(--pk);border:1px solid var(--pk3);',evening:'background:#EEF0FF;color:#5558B8;border:1px solid #818CF8;'};
  const SLOT_NAMES={morning:'🌅 早上',noon:'☀️ 中午',evening:'🌙 晚上'};
  const dayNames=['日','一','二','三','四','五','六'];

// ── ASSIGNMENT HELPERS (same as admin) ──
function parseAssignments(assignedTo){
  if(!assignedTo) return [];
  if(typeof assignedTo==='string'&&assignedTo.startsWith('[')){
    try{
      const arr=JSON.parse(assignedTo);
      if(!Array.isArray(arr)) return [];
      // Format 1: [{date, slots:[]}] — initial slot data, no sitter assigned yet
      // Format 2: [{date, slot, sitter, transport}] — after admin assigns
      // If format1 (has .slots array), return as-is for display; sitter fields will be empty
      return arr;
    }catch(e){}
  }
  return [];
}

// Check if an assignment array is format2 (has sitter assignments)
function hasAssignments(assignedTo){
  const arr=parseAssignments(assignedTo);
  return arr.some(a=>a.sitter);
}

// Get all slots for this order regardless of format
function getAllSlots(b){
  const arr=parseAssignments(b.assignedTo);
  if(!arr.length) return [];
  if(arr[0]&&arr[0].slots!==undefined){
    // Format1: [{date, slots:[]}]
    const result=[];
    arr.forEach(d=>(d.slots||[]).forEach(s=>result.push({date:d.date,slot:s,sitter:'',transport:0})));
    return result;
  }
  // Format2
  return arr;
}
function getMySessions(b, myName){
  const assigns=parseAssignments(b.assignedTo);
  if(!assigns.length) return b.assignedTo===myName?(b.tpd||1):0;
  // Format2: count slots assigned to me
  if(assigns[0]&&assigns[0].slot!==undefined){
    return assigns.filter(a=>a.sitter===myName).length;
  }
  // Format1: all slots (not yet assigned to anyone specifically)
  return assigns.reduce((s,d)=>s+(d.slots||[]).length,0);
}
function getMyTransport(b, myName){
  const assigns=parseAssignments(b.assignedTo);
  if(!assigns.length) return b.assignedTo===myName?(b.transport||0):0;
  const mine=assigns.find(a=>a.sitter===myName);
  return mine?mine.transport||0:0;
}
function getTeamOnOrder(b, myName){
  const assigns=parseAssignments(b.assignedTo);
  if(!assigns.length) return [];
  const others=[...new Set(assigns.filter(a=>a.sitter&&a.sitter!==myName).map(a=>a.sitter))];
  return others;
}
function getMySlots(b, myName){
  const assigns=parseAssignments(b.assignedTo);
  if(!assigns.length) return [];
  // Format2: filter by sitter name
  if(assigns[0]&&assigns[0].slot!==undefined){
    return assigns.filter(a=>a.sitter===myName);
  }
  // Format1: return all slots flattened
  const result=[];
  assigns.forEach(d=>(d.slots||[]).forEach(s=>result.push({date:d.date,slot:s,sitter:'',transport:0})));
  return result;
}

async function getCorrectPw(name){
  // Use index-based lookup to avoid Unicode encoding issues with Supabase
  const SITTER_ORDER=['小語','小汶','菓菓','小茹','阿瑛'];
  const SITTER_PWS=['666','cc','333','aa','111'];
  const idx=SITTER_ORDER.indexOf(name);
  if(idx>=0) return SITTER_PWS[idx];
  return SITTER_INIT_PWS[name]||null;
}

function getSitterPws(){
  // Returns all current passwords (for admin display)
  const result={...SITTER_INIT_PWS};
  const changed=getChangedPws();
  Object.keys(changed).forEach(n=>{ if(result[n]!==undefined) result[n]=changed[n]; });
  return result;
}

// 計算單筆訂單保母薪資
function calcSitterSalary(b){
  const mySess=getMySessions(b,ME?.name||'');
  const sessions=mySess||(b.dateSlotData?.length?b.dateSlotData.reduce((s,d)=>s+(d.slots||[]).length,0):((b.days||0)*(b.tpd||1)));
  const svcRate=200;
  const svcTotal=svcRate*sessions;
  // 加購費
  const ADDON_P={餵藥:50,點藥:50,舒緩按摩:100,剪指甲:50,協助排便導尿:80,收信:30,澆花:30,倒垃圾:50};
  const addonPerSession=(b.addons||[]).reduce(function(s,a){
    const m=a.match(/^(.+?)×(\d+)/);
    const name=m?m[1]:a;
    const qty=m?parseInt(m[2]):1;
    return s+(ADDON_P[name]||50)*qty;
  },0);
  const addonTotal=addonPerSession*sessions;
  const myTransport=ME?.name?getMyTransport(b,ME.name):(b.transport||0);
  const transportTotal=myTransport*sessions;
  const total=svcTotal+addonTotal+transportTotal;
  return{sessions,svcRate,svcTotal,addonPerSession,addonTotal,transport:myTransport,transportTotal,total};
}

function buildSlotCalendar(slots, holSet, slbl){
  if(!slots||!slots.length) return '';

  // Local date string helper (avoids UTC offset bug with toISOString)
  function toDS(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  var sorted=slots.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var firstDate=new Date(sorted[0].date+'T00:00:00');
  var lastDate=new Date(sorted[sorted.length-1].date+'T00:00:00');

  var startDay=new Date(firstDate);
  startDay.setDate(startDay.getDate()-((startDay.getDay()+6)%7));
  var endDay=new Date(lastDate);
  endDay.setDate(endDay.getDate()+(6-(lastDate.getDay()+6)%7));

  var slotMap={};
  sorted.forEach(function(s){
    if(!slotMap[s.date]) slotMap[s.date]=[];
    slotMap[s.date].push(s.slot);
  });

  var todayDS=toDS(new Date());
  var dayNames=['一','二','三','四','五','六','日'];
  var slotLabel={morning:'早上', noon:'中午', evening:'晚上'};
  var slotColor={morning:'cal-m', noon:'cal-n', evening:'cal-e'};

  var html='<div style="font-size:.74rem;font-weight:900;color:var(--pk);margin:6px 0 4px;">📅 我的服務時段</div>';
  html+='<table class="slot-cal"><thead><tr>';
  dayNames.forEach(function(d){ html+='<th>'+d+'</th>'; });
  html+='</tr></thead><tbody>';

  var cur=new Date(startDay);
  var lastMonthKey='';

  while(toDS(cur)<=toDS(endDay)){
    var cells=[];
    for(var di=0;di<7;di++){
      var ds=toDS(cur);
      cells.push({
        ds:ds,
        day:cur.getDate(),
        month:cur.getMonth()+1,
        year:cur.getFullYear(),
        isHol:holSet.has(ds),
        isToday:ds===todayDS,
        slots:slotMap[ds]||null
      });
      cur.setDate(cur.getDate()+1);
    }

    // Dominant month of this week
    var monthCount={};
    cells.forEach(function(cell){
      var k=cell.year+'-'+cell.month;
      monthCount[k]=(monthCount[k]||0)+1;
    });
    var dominantKey=Object.keys(monthCount).sort(function(a,b){return monthCount[b]-monthCount[a];})[0];

    if(dominantKey!==lastMonthKey){
      var parts=dominantKey.split('-');
      html+='<tr><td colspan="7" style="background:var(--pk);color:#fff;font-weight:900;font-size:.9rem;padding:6px 10px;text-align:left;border:1px solid var(--pk2);">'+parts[0]+'年 '+parseInt(parts[1])+'月</td></tr>';
      lastMonthKey=dominantKey;
    }

    html+='<tr>';
    cells.forEach(function(cell){
      var cls=(cell.isHol?'hol':'')+(cell.isToday?' today':'');
      html+='<td class="'+cls.trim()+'">';
      html+='<div class="cal-date">'+cell.day+'</div>';
      if(cell.slots){
        cell.slots.forEach(function(slot){
          html+='<div class="cal-slot '+(slotColor[slot]||'cal-m')+'">'+(slotLabel[slot]||slot)+'</div>';
        });
      }
      html+='</td>';
    });
    html+='</tr>';
  }

  html+='</tbody></table>';
  return html;
}

var _checkinStateKey = 'checkinState_' + new Date().toISOString().slice(0,10);
var _checkinState = (function(){
  try{
    var saved = sessionStorage.getItem(_checkinStateKey);
    if(saved) return JSON.parse(saved);
  }catch(e){}
  return {};
})();
function _saveCheckinState(){
  try{ sessionStorage.setItem(_checkinStateKey, JSON.stringify(_checkinState)); }catch(e){}
  // 清除舊的 key（昨天之前的）
  try{
    Object.keys(sessionStorage).filter(function(k){
      return k.startsWith('checkinState_') && k !== _checkinStateKey;
    }).forEach(function(k){ sessionStorage.removeItem(k); });
  }catch(e){}
}

async function saveEditReport(){
  const ts = _editingRepTs;
  if(!ts)return;
  // Direct DB fetch to avoid cache/type mismatch issues
  var rep=null;
  try{
    const{data}=await _supa.from('reports').select('*').eq('ts',Number(ts)||ts).limit(1);
    if(data&&data.length) rep=data[0];
  }catch(e){}
  if(!rep){
    const allRep=await getReps();
    rep=allRep.find(function(x){return String(x.ts)===String(ts);});
  }
  if(!rep){alert('找不到回報記錄，請重新整理後再試');return;}
  const r=rep;

  const date = document.getElementById('er-date').value;
  const timeStart = document.getElementById('er-start').value;
  const timeEnd = document.getElementById('er-end').value;
  const diary = document.getElementById('er-diary').value;

  const disinfect=Array.from(document.querySelectorAll('input[name="er-disinfect"]:checked')).map(function(x){return x.value;});
  const services=Array.from(document.querySelectorAll('input[name="er-svc"]:checked')).map(function(x){return x.value;});
  const safety=Array.from(document.querySelectorAll('input[name="er-safety"]:checked')).map(function(x){return x.value;});

  const petReports = (r.petReports||r.pet_reports||[]).map(function(p,i){
    return Object.assign({},p,{
      spirit:document.getElementById('er-spirit-'+i)?.value||p.spirit||'',
      eyes:document.getElementById('er-eyes-'+i)?.value||p.eyes||'',
      poop:document.getElementById('er-poop-'+i)?.value||p.poop||'',
      food:document.getElementById('er-food-'+i)?.value||p.food||'',
      water:document.getElementById('er-water-'+i)?.value||p.water||'',
      note:document.getElementById('er-pet-note-'+i)?.value||p.note||''
    });
  });

  // Upload all photos to R2 (replace base64 with URLs)
  var _petPhotosSrc=(window._erPhotos||[]).map(function(p){return p.dataUrl||p.url||'';}).filter(Boolean);
  var petPhotos=[];
  for(var _pi=0;_pi<_petPhotosSrc.length;_pi++){
    var _src=_petPhotosSrc[_pi];
    if(_src.startsWith('data:')){
      try{ var _url=await uploadImageToR2(_src,'pet-'+Date.now()+'-'+_pi+'.jpg'); petPhotos.push(_url); }
      catch(e){ console.warn('照片上傳失敗，改存URL:',e); petPhotos.push(_src); }
    } else { petPhotos.push(_src); }
  }
  const erVideoList=(window._erVideos||[]).map(function(v){return v.dataUrl;});
  const videoDataUrl=erVideoList[0]||'';
  const updates = {date:date, time_start:timeStart, time_end:timeEnd, diary:diary,
    disinfect:disinfect, services:services, safety:safety, pet_reports:petReports,
    pet_photos:petPhotos, video_data_url:videoDataUrl, videos:erVideoList};

  const btn = document.querySelector('#editRepMod button');
  if(btn){btn.textContent='⏳ 儲存中...';btn.disabled=true;}

  try{
    await dbUpdateReport(ts, updates);
    // Update local cache
    // Invalidate cache so next load gets fresh data
    if(typeof clearOrdersCache==='function') clearOrdersCache();
    _allReportsCache=null; _allReportsCacheTime=0;
    document.getElementById('er-msg').textContent='✅ 已儲存';
    setTimeout(function(){
      document.getElementById('editRepMod').style.display='none';
      renderCases(); // refresh report list
    }, 800);
  }catch(e){
    alert('儲存失敗：'+e.message);
  }finally{
    if(btn){btn.textContent='💾 儲存';btn.disabled=false;}
  }
}

async function deleteReport(ts){
  if(!confirm('確定要刪除這筆回報紀錄嗎？\n此操作無法復原。')) return;
  try{
    const{error}=await _supa.from('reports').delete().eq('ts',ts);
    if(error) throw new Error(error.message);
    renderCases();
  }catch(e){
    alert('刪除失敗：'+e.message);
  }
}
async function exportSingleReport(ts){
  const _allRep=await getReps();

function buildReportText(r){
  const line='─'.repeat(44);
  let t='';
  t+=`【貓窩裏 照護回報明細】\n`;
  t+=`保母：${r.sitter}　日期：${r.date}　時段：${r.timeStart||'—'}${r.timeEnd?' — '+r.timeEnd:''}\n`;
  t+=`案件：${r.bookName}\n`;
  t+=line+'\n';

  if(r.disinfect?.length){
    t+=`\n🧴 進門前準備\n`;
    r.disinfect.forEach(d=>t+=`  ✓ ${d}\n`);
  }

  if(r.petReports?.length){
    r.petReports.forEach(p=>{
      t+=`\n🐾 ${p.name} 個別回報\n`;
      t+=`  精神狀態：${p.spirit||'—'}\n`;
      t+=`  眼睛/鼻子：${p.eyes||'—'}\n`;
      t+=`  糞便狀況：${p.poop||'—'}\n`;
      t+=`  尿液狀況：${p.urine||'—'}\n`;
      t+=`  進食狀況：${p.food||'—'}\n`;
      t+=`  飲水狀況：${p.water||'—'}\n`;
      if(p.emotions?.length) t+=`  今日情緒：${p.emotions.join('、')}\n`;
      if(p.notes) t+=`  互動紀錄：${p.notes}\n`;
    });
  }

  if(r.services?.length){
    t+=`\n🧹 今日服務內容\n`;
    r.services.forEach(s=>t+=`  ✔ ${s}\n`);
  }

  if(r.safety?.length){
    t+=`\n🔐 離開前安全巡檢\n`;
    r.safety.forEach(s=>t+=`  ✔ ${s}\n`);
  }

  if(r.diary){
    t+=`\n💌 保母心情日記\n  ${r.diary}\n`;
  }

  t+=`\n${line}\n匯出時間：${new Date().toLocaleString('zh-TW')}\n`;
  return t;
}

function uploadPetPhoto(idx, input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const dataUrl=e.target.result;
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      const size=240;
      canvas.width=canvas.height=size;
      const ctx=canvas.getContext('2d');
      ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.clip();
      const scale=Math.min(size/img.width,size/img.height);
      const w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      const compressed=canvas.toDataURL('image/jpeg',0.75);
      const key='petphoto_'+currentBookId+'_'+idx;
      try{localStorage.setItem(key,compressed);}catch(e){}
      petProfilePhotos[key]=compressed;
      savePetPhotoToSupabase(currentBookId,idx,compressed);
      const avatar=document.getElementById('pet-avatar-'+idx);
      if(avatar) avatar.innerHTML='<img src="'+compressed+'" style="width:100%;height:100%;object-fit:cover;">';
      buildPetTabs(activePetIdx);
    };
    img.src=dataUrl;
  };
  reader.readAsDataURL(file);
}

// Compress image to max 800px, JPEG quality 0.72
function compressImage(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=800;
      let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.72));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function loadPetPhoto(input,idx){
  const file=input.files[0];if(!file)return;
  compressImage(file,url=>{
    const existing=reportPhotos.findIndex(p=>p.slot===idx&&p.type==='pet');
    if(existing>=0)reportPhotos[existing].dataUrl=url;
    else reportPhotos.push({slot:idx,dataUrl:url,type:'pet'});

    if(inner)inner.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">`;
  });
}

var EDGE_FN_URL = 'https://cswejuvithewfyhmisfc.supabase.co/functions/v1/smart-action';


async function uploadImageToR2(dataUrl, filename){
  // Convert base64 dataUrl to Blob
  var parts = dataUrl.split(',');
  var mime = parts[0].match(/:(.*?);/)[1];
  var ext = mime.split('/')[1]||'jpg';
  var fname = filename||(Date.now()+'.'+ext);
  var byteStr = atob(parts[1]);
  var ab = new ArrayBuffer(byteStr.length);
  var ia = new Uint8Array(ab);
  for(var i=0;i<byteStr.length;i++) ia[i]=byteStr.charCodeAt(i);
  var blob = new Blob([ab],{type:mime});
  var file = new File([blob], fname, {type:mime});

  // Get presigned URL
  var res = await fetch(EDGE_FN_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPA_KEY},
    body:JSON.stringify({action:'get-upload-url', filename:fname, contentType:mime})
  });
  if(!res.ok) throw new Error('取得上傳網址失敗');
  var json = await res.json();

  // PUT to R2
  var r2res = await fetch(json.uploadUrl,{
    method:'PUT',
    headers:{'Content-Type':mime},
    body:blob
  });
  if(!r2res.ok) throw new Error('R2上傳失敗：'+r2res.status);
  return json.publicUrl;
}

async function uploadVideoToR2(file, onProgress){
  // Step1: 向 Edge Function 取得 Presigned URL
  var res = await fetch(EDGE_FN_URL, {
    method: 'POST',
    headers: {
      'Content-Type':  'application/json',
      'Authorization': 'Bearer ' + SUPA_KEY
    },
    body: JSON.stringify({action:'get-upload-url', filename: file.name, contentType: file.type||'video/mp4'})
  });
  if(!res.ok) throw new Error('取得上傳網址失敗：' + await res.text());
  var _json = await res.json();
  var uploadUrl = _json.uploadUrl;
  var publicUrl = _json.publicUrl;

  // Step2: 直接 PUT 影片到 R2（原始 binary，不轉 base64）
  var xhr = new XMLHttpRequest();
  await new Promise(function(resolve, reject){
    xhr.open('PUT', uploadUrl);
    xhr.setRequestHeader('Content-Type', file.type||'video/mp4');
    if(onProgress) xhr.upload.onprogress = function(e){
      if(e.lengthComputable) onProgress(Math.round(e.loaded/e.total*100));
    };
    xhr.onload = function(){ xhr.status<300?resolve():reject(new Error('R2 上傳失敗：'+xhr.status)); };
    xhr.onerror = function(){ reject(new Error('網路錯誤')); };
    xhr.send(file);
  });

  return publicUrl;
}
async function loadReportVideo(input){
  var files=Array.from(input.files);
  if(!files.length) return;
  input.value='';
  for(var fi=0;fi<files.length;fi++){
    var file=files[fi];
    var mb=file.size/1024/1024;
    // Create placeholder
    var pid='vp-'+Date.now()+'-'+fi;
    var wrap=document.getElementById('videoPreviewWrap');
    wrap.style.display='block';
    wrap.insertAdjacentHTML('beforeend',
      '<div id="'+pid+'" style="padding:10px;background:var(--pk4);border:1.5px solid var(--pk3);border-radius:10px;margin-bottom:8px;">'
      +'<div style="font-size:.8rem;font-weight:800;color:var(--pk);">⏳ 上傳中：'+file.name+' ('+mb.toFixed(1)+'MB)</div>'
      +'<div id="'+pid+'-bar" style="height:6px;background:var(--pk3);border-radius:3px;margin-top:6px;"><div id="'+pid+'-prog" style="height:100%;width:0%;background:var(--pk);border-radius:3px;transition:width .3s;"></div></div>'
      +'</div>'
    );
    try{
      var publicUrl=await uploadVideoToR2(file, function(pct){
        var el=document.getElementById(pid+'-prog');
        if(el) el.style.width=pct+'%';
      });
      // Replace placeholder with video preview
      var el2=document.getElementById(pid);
      if(el2) el2.outerHTML=
        '<div style="margin-bottom:8px;background:#f9f9f9;border:1.5px solid var(--pk3);border-radius:10px;padding:8px;">'
        +'<video controls style="width:100%;border-radius:8px;max-height:200px;" src="'+publicUrl+'"></video>'
        +'<div style="font-size:.72rem;color:var(--tl);margin-top:4px;">✅ '+file.name+'</div>'
        +'</div>';
      reportVideos.push({dataUrl:publicUrl, name:file.name, size:file.size});
    }catch(e){
      var el3=document.getElementById(pid);
      if(el3) el3.innerHTML='<div style="color:#E05252;font-size:.8rem;">❌ '+file.name+' 上傳失敗：'+e.message+'</div>';
    }
  }
}

function loadCleanPhoto(input,groupIdx,side){
  const file=input.files[0];if(!file)return;

  });
}

async function previewReport(ts){
  const _allReps=await getReps();
  const r=_allReps.find(x=>x.ts===ts);if(!r)return;
  let html='';
  const block=(title,content)=>`<div class="prev-section"><div class="prev-title">${title}</div><div class="prev-content">${content}</div></div>`;
  const tag=t=>`<span class="prev-tag">✓ ${t}</span>`;

  html+=block('📅 基本資訊',`${r.date} ${r.timeStart||''}${r.timeEnd?' — '+r.timeEnd:''} ｜ 保母：${r.sitter}`);
  if(r.disinfect?.length)html+=block('🧴 進門前準備',r.disinfect.map(tag).join(''));
  r.petReports?.forEach(p=>{
    html+=`<div class="prev-section"><div class="prev-title">🐾 ${p.name}</div>
      <div class="prev-content">
        精神：${p.spirit} ｜ 眼鼻：${p.eyes}<br>
        糞便：${p.poop} ｜ 尿液：${p.urine}<br>
        進食：${p.food} ｜ 飲水：${p.water}
        ${p.emotions?.length?`<br>💞 情緒：${p.emotions.join('・')}`:''}
        ${p.notes?`<br>✨ ${p.notes}`:''}
      </div></div>`;
  });
  if(r.services?.length)html+=block('🧹 服務內容',r.services.map(tag).join(''));
  const petPhotos=r.photos?.filter(p=>p.key.startsWith('pet'));
  if(petPhotos?.length){
    html+=`<div class="prev-section"><div class="prev-title">🌟 毛孩美照（${petPhotos.length}張）</div>
      <div class="prev-grid">${petPhotos.map(p=>`<img class="prev-photo" src="${p.url}">`).join('')}</div></div>`;
  }
  if(r.hasVideo)html+=block('🎬 影片',`${r.videoName}（${r.videoDuration}秒）`);
  if(r.safety?.length)html+=block('🔐 環境安全巡檢',r.safety.map(tag).join(''));
  if(r.diary)html+=block('💌 保母心情日記',`<em style="line-height:1.8;">${r.diary}</em>`);

  document.getElementById('prevContent').innerHTML=html;
  document.getElementById('previewMod').classList.add('show');
}
